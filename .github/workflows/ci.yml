name: ci
on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; a newer push cancels the run it supersedes.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: medos, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medos" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://medos@127.0.0.1:5432/medos_dev
      TEST_DATABASE_URL: postgresql://medos@127.0.0.1:5432/medos_test
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-000001
      ARGON2_MEMORY_KIB: "1024"
      ARGON2_PASSES: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: psql -h 127.0.0.1 -U medos -d postgres -c "CREATE DATABASE medos_dev" -c "CREATE DATABASE medos_test"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test        # shared, API (real database), web unit tests
      # The API suite again with the application itself on the restricted database login and the tenant context on (row-level
      # security, docs/rls.md). `pnpm test` has just enabled that login and written its secret to .local/app-db.env.
      - run: |
          PW="$(sed -n 's/^APP_DB_PASSWORD=//p' .local/app-db.env)"
          export TEST_APP_DATABASE_URL="postgresql://medos_app:${PW}@127.0.0.1:5432/medos_test"
          export DB_TENANT_CONTEXT=on
          pnpm --filter @medos/api exec node --test --test-concurrency=1 "dist-test/**/*.spec.js"
      - run: pnpm build
      - run: pnpm licenses:audit
      - run: pnpm audit --prod --audit-level=high

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: medos, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medos" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @medos/api build && pnpm --filter @medos/web build
      - run: pnpm --filter @medos/web exec playwright install --with-deps chromium
      # The Windows-specific e2e-prepare.ps1 is replaced by the equivalent steps on Linux:
      - run: |
          psql -h 127.0.0.1 -U medos -d postgres -c "CREATE DATABASE medos_e2e"
          DATABASE_URL=postgresql://medos@127.0.0.1:5432/medos_e2e pnpm --filter @medos/database migrate
          DATABASE_URL=postgresql://medos@127.0.0.1:5432/medos_e2e JWT_ACCESS_SECRET=e2e-only-secret-e2e-only-secret-0001 ARGON2_MEMORY_KIB=1024 ARGON2_PASSES=1 SEED_PASSWORD='E2e-Passw0rd-2026!' SEED_PROFILE=small node apps/api/dist/cli/seed.js
      - run: pnpm --filter @medos/web exec playwright test
        env:
          E2E_DATABASE_URL: postgresql://medos@127.0.0.1:5432/medos_e2e

  # The container images and the compose stack, built and started for real (they cannot be run on the development machine).
  # Throwaway secrets are generated per run; nothing here is a real secret.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway settings for a test stack
        run: |
          {
            echo "POSTGRES_USER=medos"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
          } > .env
      - name: Compose files are valid (plain, and with the secrets overlay)
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.secrets.yml config --quiet
      - name: Build the images and start the stack, waiting for every health check
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Create a hospital, then sign in through the web app
        run: |
          cat > /tmp/tenant.json <<'EOF'
          {"tenant":{"name":"CI Hospital","code":"ci-hospital","timezone":"Asia/Kolkata"},"facility":{"name":"Main Campus","code":"MAIN","city":"Kolkata","state":"West Bengal"},"admin":{"username":"admin","fullName":"CI Admin","password":"Ci-Passw0rd-2026!"}}
          EOF
          docker compose cp /tmp/tenant.json api:/tmp/tenant.json
          docker compose exec -T api node apps/api/dist/cli/provision.js /tmp/tenant.json
          code=$(curl -s -o /tmp/login.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/session/login \
            -H 'content-type: application/json' -H 'x-medos-csrf: 1' \
            -d '{"tenantCode":"ci-hospital","identifier":"admin","password":"Ci-Passw0rd-2026!"}')
          echo "sign-in: HTTP $code"; cat /tmp/login.json; echo
          test "$code" = 200
      - name: The API is not reachable from outside this machine
        run: |
          ss -ltn | grep -E ':(4000|5432)\b' | grep -v '127.0.0.1' && { echo "a port is open to the network"; exit 1; } || echo "API and database listen on 127.0.0.1 only"
      - name: Show logs if anything failed
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

  # HTTPS in front of the web app: certificate, security header, and a forged client address must not survive.
  docker-proxy:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway settings, proxy on localhost
        run: |
          {
            echo "POSTGRES_USER=medos"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
            echo "SITE_ADDRESS=localhost"
          } > .env
      - run: docker compose --profile proxy up -d --build --wait --wait-timeout 300
      - name: HTTPS serves the sign-in page with the security header
        run: |
          curl -sk -o /dev/null -w 'https /login: HTTP %{http_code}\n' https://localhost/login
          curl -skI https://localhost/login | tee /tmp/headers.txt
          grep -qi '^strict-transport-security:' /tmp/headers.txt
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/login)" = 200
      - name: Plain HTTP is redirected to HTTPS
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/login)" = 308
      - name: A client-supplied X-Forwarded-For is replaced, not trusted
        run: |
          # Ten sign-in attempts per address are allowed per minute. If the forged header were believed, every attempt below would
          # look like a new address and none would ever be limited.
          for i in $(seq 1 14); do
            curl -sk -o /dev/null -w '%{http_code} ' -X POST https://localhost/api/session/login \
              -H 'content-type: application/json' -H 'x-medos-csrf: 1' -H "X-Forwarded-For: 203.0.113.$i" \
              -d '{"tenantCode":"nobody","identifier":"x","password":"wrong-password"}'
          done | tee /tmp/codes.txt
          echo
          grep -q '429' /tmp/codes.txt
      - name: Show logs if anything failed
        if: failure()
        run: docker compose --profile proxy logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose --profile proxy down -v
