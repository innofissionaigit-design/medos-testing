# Secrets from files instead of values in .env (Docker secrets). Layer it on the base file:
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d --build --wait
#
# Put each secret alone in a file under ./secrets/ (that folder is git-ignored and never copied into an image):
#   secrets/postgres_password     the database password, URL-safe (for example:  openssl rand -hex 24)
#   secrets/database_url          postgresql://<POSTGRES_USER>:<that password>@db:5432/<POSTGRES_DB>
#   secrets/jwt_access_secret     32+ random characters (for example:  openssl rand -base64 48 | tr -d '\n')
# Keep the files readable by you only (chmod 600). POSTGRES_PASSWORD, DATABASE_URL and JWT_ACCESS_SECRET are then not
# needed in .env at all. With a real secrets manager, write the same files from it at deploy time.
# S3 keys can use the same pattern: S3_ACCESS_KEY_ID_FILE / S3_SECRET_ACCESS_KEY_FILE (see docs/deployment.md).
secrets:
  postgres_password: { file: ./secrets/postgres_password }
  database_url: { file: ./secrets/database_url }
  jwt_access_secret: { file: ./secrets/jwt_access_secret }

services:
  db:
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]

  # The migration tool reads DATABASE_URL from its environment (it has no *_FILE support), so the file is read here.
  migrate:
    environment:
      DATABASE_URL: !reset null
    command: ["sh", "-c", "DATABASE_URL=\"$$(cat /run/secrets/database_url)\" exec pnpm --filter @medos/database migrate"]
    secrets: [database_url]

  api:
    environment:
      DATABASE_URL: !reset null
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_ACCESS_SECRET: !reset null
      JWT_ACCESS_SECRET_FILE: /run/secrets/jwt_access_secret
    secrets: [database_url, jwt_access_secret]
